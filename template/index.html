<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{APP_NAME}} — app do ecossistema do Meu Ecoo." />
    <meta name="theme-color" content="#f6f6f4" />
    <!--
      Tema antes da primeira pintura (mesmo resultado do aplicarTema de src/lib/tema.ts; tema.test.ts confere):
      a escolha salva em {{APP_SLUG}}:tema (claro | escuro | sistema), padrão claro. As duas cores são o
      --fundo de cada tema (src/index.css).
    -->
    <script>
      (function () {
        var tema = "claro";
        try {
          var pref = localStorage.getItem("{{APP_SLUG}}:tema");
          if (pref === "escuro" || (pref === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches)) tema = "escuro";
        } catch (e) {}
        document.documentElement.setAttribute("data-tema", tema);
        document.documentElement.style.colorScheme = tema === "escuro" ? "dark" : "light";
        var barra = document.querySelector('meta[name="theme-color"]');
        if (barra) barra.content = tema === "escuro" ? "#141412" : "#f6f6f4";
      })();
    </script>
    <title>{{APP_NAME}}</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
